      ROVER_UI_MAX_RIM_SPEED: '1.7'
      ROVER_UI_TRACK_WIDTH: '1.0204'
      ROVER_UI_EXPO_LINEAR: '0.3'
      ROVER_UI_EXPO_ANGULAR: '0.5'
      ROVER_VDA5050_ENABLE: 'false'
      ROVER_VDA5050_LOCAL_BROKER: 'true'
      ROVER_VDA5050_BROKER_HOST: '127.0.0.1'
      ROVER_VDA5050_BROKER_PORT: '1883'
      ROVER_VDA5050_BROKER_USER:
      ROVER_VDA5050_BROKER_PASSWORD:
      ROVER_VDA5050_BROKER_TLS: 'auto'
      ROVER_VDA5050_MANUFACTURER: 'MechatronicsAcademy'
      ROVER_VDA5050_SERIAL_NUMBER: 'rover_a1'
      ROVER_VDA5050_MAP_FRAME:
  rover-a1-sensors:
    build:
      context: ./rover_a1_sensors
    # Start order only; start.sh still waits until the router accepts connections.
    depends_on:
      - rover-a1-zenoh-router
    restart: always
    # Its sshd listens on 23: platform 22, sensors 23, orchestrator 24, drive-interface 25, vda5050 26.
    network_mode: host
    # The RealSense D435i enumerates under /dev/bus/usb and /dev/video*, and re-enumerates on
