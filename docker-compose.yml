version: '2.4'

services:
  rovera1-app:
    build:
      context: .
    privileged: true
    restart: always
    cap_add:
      - SYS_RAWIO
    network_mode: host
    labels:
      io.balena.features.dbus: 'true'
      io.balena.features.balena-socket: 'true'
      io.balena.features.sysfs: 'true'
