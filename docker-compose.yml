  # VDA 5050 fleet interface: InOrbit's connector + rover_vda5050_adapter (rover_vda5050), driving
  # through rover_mission_manager in rover-a1-orchestrator. Idle unless ROVER_START_VDA5050=true.
  # Runs its own Mosquitto (1883, WebSockets 9001) with ROVER_VDA5050_LOCAL_BROKER=true; sshd on 27.
  rover-a1-vda5050:
    build:
      context: ./rover_a1_vda5050
    # Start order only; start.sh still waits until the router accepts connections.
    depends_on:
      - rover-a1-zenoh-router
    restart: always
    network_mode: host
    environment:
      ROVER_NAMESPACE: 'rover'
      ROVER_ZENOH_MODE: 'client'
      ROVER_FOXGLOVE_TOPIC_WHITELIST:
      ROVER_FOXGLOVE_SERVICE_WHITELIST:
      ROVER_START_ROS_PLATFORM: 'true'
      ROVER_START_NAVIGATION: 'false'
      ROVER_START_MISSION_MANAGER: 'false'
      ROVER_START_DRIVE_MODE: 'true'
      ROVER_DRIVE_DEFAULT_MODE: 'assisted'
