version: '2.1'

services:
  rovera1-app:
    build: .
    privileged: true
    restart: always
    cap_add:
      - SYS_RAWIO
    network_mode: host
    labels:
      io.balena.features.dbus: 'true'         
      io.balena.features.balena-socket: 'true'
      io.balena.features.sysfs: 'true'

  phidget-server:
    build: ./phidgets_server
    privileged: true
    restart: always
    network_mode: host
    environment:
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/host/run/dbus/system_bus_socket
    labels:
      io.balena.features.dbus: 'true'         
      io.balena.features.balena-socket: 'true'
      io.balena.features.sysfs: 'true'