      # Script in the image (TCP connect to the local broker when there is one); no `$` here,
      # (balena's compose parser mangles `$$`).
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Wi-Fi uplink page (app: github.com/RaduPotlog/rover_networking, rutx11/): switches the
  # RUTX11's Wi-Fi client to another network IN PLACE and keeps firewall zones / NAT /
  # forwarding consistent, so the wired LAN and the rover AP keep internet. Talks to the router
  # over SSH; changes are rolled back by the router itself if the new uplink does not come up.
  # No ROS, no sshd. Idles without NETUI_PASSWORD / RUTX11_PASSWORD.
  rover-a1-network:
    build:
      context: ./rover_a1_network
    restart: always
    network_mode: host
    volumes:
      - rover-network:/data
    environment:
      ROVER_NETWORK_ENABLE: 'true'
      NETUI_PORT: '5080'
      NETUI_USER: 'root'
      # Set both as service variables of rover-a1-network, not fleet-wide (see README).
      NETUI_PASSWORD:
      RUTX11_PASSWORD:
      RUTX11_HOST: '192.168.1.1'
      RUTX11_USER: 'root'
      # 'auto' finds the Wi-Fi uplink in the config (RutOS names it WWAN1, wan1, wan2, …).
      UPLINK_IFACE: 'auto'
      UPLINK_ZONE: 'wwan'
      LAN_ZONE: 'lan'
      CLIENT_NETS: 'lan WWAN'
    healthcheck:
      # Script in the image (reads NETUI_PORT); no `$` here (balena's compose parser mangles `$$`).
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  # Persists the SLAM map across container restarts for localization_source=amcl.
  rover-maps:
  # Persists the measured RC stick calibration. Only rover-a1-platform needs it: clients reach
  # the calibration through the node's rc/calibration services, never by reading the file.
  rover-config:
  # Router host key (pinned on first use) and the log of uplink changes (rover-a1-network).
  rover-network:
