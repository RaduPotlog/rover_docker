version: '2.4'

# Every service declares the same ROVER_* variables, in the same order; each service acts only
# on some of them (README.md, "Device variables"). A balenaCloud fleet/device variable overrides
# them. `KEY: 'value'` is a default; `KEY:` stays unset unless balenaCloud sets it.
#
# ROVER_NAMESPACE              ROS namespace and TF prefix; keep it equal on every service
# ROVER_START_ROS_PLATFORM     platform: run rover_bringup (the only switch on by default)
# ROVER_START_NAVIGATION       orchestrator: run Nav 2 (also needs ROVER_START_ROS_PLATFORM)
# ROVER_START_MISSION_MANAGER  orchestrator: run the mission manager on top of Nav 2
# ROVER_START_SENSORS          sensors: run the sensor payload drivers at all
# ROVER_USE_GPS                sensors: GNSS driver; platform: GPS fusion;
#                              orchestrator: Nav 2 localization_source gps vs odom
# ROVER_GPS_PUBLISH_MAP_TF     platform: global EKF publishes map -> odom (default false: SLAM/AMCL
#                              own it); orchestrator: localization_source checks
# ROVER_USE_LIDAR              sensors: RS16 driver; orchestrator: warns when off
# ROVER_LOCALIZATION_SOURCE    orchestrator: odom | gps | slam | amcl | indoor, overrides ROVER_USE_GPS;
#                              indoor = drive-UI mapping + maps in /maps (rover_indoor_nav_manager);
#                              sensors: indoor/slam/amcl make poor GNSS accuracy a WARN, not an ERROR
# ROVER_NAV_MAP                orchestrator: map yaml, default rover_navigation's empty_world;
#                              REQUIRED for localization_source=amcl (the default empty map
#                              cannot localize) - build one with =slam first, see below
# ROVER_AMCL_INITIAL_POSE_*    orchestrator: X/Y/YAW AMCL is seeded with at startup, in the map
#                              frame; unset = 0,0,0, correct only if the map origin is the dock
# ROVER_{GPS,IMU,LIDAR}_*      platform (rover_description): sensor mount pose relative to
#                              body_link; unset = URDF default
# ROVER_COCKPIT_*              cockpit: http port, login, allowed origins and debug logging; no password = cockpit-ws is not started (sshd on 26 stays up)
# ROVER_DRIVE_*                drive-interface: on/off, http port, login, teleop speed limits (m/s, rad/s),
#                              rim-speed limit + track width (keep equal to rover_crsf_teleop.yaml),
#                              stick expo per axis (0 linear .. 1 softest);
#                              no password = nginx is not started (the container idles, sshd on 25 only)
#
# All services use host networking: they share the Zenoh router on 127.0.0.1:7447 (run by the
# platform), and the sensors receive UDP (NMEA 10110, RS16 6699/7788) directly.

services:
  rover-a1-platform:
    build:
      context: ./rover_a1_platform
    # Direct hardware access for the rover drivers.
    privileged: true
    restart: always
    network_mode: host
    labels:
      io.balena.features.dbus: 'true'
      # rover_safety powers off the device through the Supervisor API (/v1/shutdown).
      io.balena.features.supervisor-api: '1'
      io.balena.features.balena-socket: 'true'
      io.balena.features.sysfs: 'true'
    # rover_crsf_teleop writes the measured RC stick calibration to
    # /config/rover_crsf_teleop/rc_calibration.yaml when an operator applies one from the Cockpit
    # RC page. A named volume, not a bind mount, for the same reason as rover-maps: a balenaOS
    # device filesystem is read-only outside one. It survives container restarts and image
    # updates, but not a device reprovision - copy it off with
    # `scp root@<device>:/config/rover_crsf_teleop/rc_calibration.yaml .` (sshd is on port 22).
    volumes:
      - rover-config:/config
    environment:
      ROVER_NAMESPACE: 'rover'
      ROVER_START_ROS_PLATFORM: 'true'
      ROVER_START_NAVIGATION: 'false'
      ROVER_START_MISSION_MANAGER: 'false'
      ROVER_START_SENSORS: 'false'
      ROVER_USE_GPS: 'false'
      ROVER_GPS_PUBLISH_MAP_TF: 'false'
      ROVER_USE_LIDAR: 'false'
      ROVER_LOCALIZATION_SOURCE:
      ROVER_NAV_MAP:
      ROVER_AMCL_INITIAL_POSE_X:
      ROVER_AMCL_INITIAL_POSE_Y:
      ROVER_AMCL_INITIAL_POSE_YAW:
      ROVER_GPS_LOCALIZATION_X:
      ROVER_GPS_LOCALIZATION_Y:
      ROVER_GPS_LOCALIZATION_Z:
      ROVER_GPS_ORIENTATION_R:
      ROVER_GPS_ORIENTATION_P:
      ROVER_GPS_ORIENTATION_Y:
      ROVER_IMU_LOCALIZATION_X:
      ROVER_IMU_LOCALIZATION_Y:
      ROVER_IMU_LOCALIZATION_Z:
      ROVER_IMU_ORIENTATION_R:
      ROVER_IMU_ORIENTATION_P:
      ROVER_IMU_ORIENTATION_Y:
      ROVER_LIDAR_LOCALIZATION_X:
      ROVER_LIDAR_LOCALIZATION_Y:
      ROVER_LIDAR_LOCALIZATION_Z:
      ROVER_LIDAR_ORIENTATION_R:
      ROVER_LIDAR_ORIENTATION_P:
      ROVER_LIDAR_ORIENTATION_Y:
      ROVER_COCKPIT_PORT: '80'
      ROVER_COCKPIT_USER: 'rover'
      ROVER_COCKPIT_PASSWORD:
      ROVER_COCKPIT_DEBUG: 'false'
      ROVER_COCKPIT_ORIGINS:
      ROVER_DRIVE_ENABLE: 'true'
      ROVER_DRIVE_PORT: '5000'
      ROVER_DRIVE_USER: 'rover'
      ROVER_DRIVE_PASSWORD:
      ROVER_DRIVE_MAX_LINEAR: '1.0'
      ROVER_DRIVE_MAX_ANGULAR: '1.0'
      ROVER_DRIVE_MAX_RIM_SPEED: '1.7'
      ROVER_DRIVE_TRACK_WIDTH: '1.0204'
      ROVER_DRIVE_EXPO_LINEAR: '0.3'
      ROVER_DRIVE_EXPO_ANGULAR: '0.5'
  rover-a1-orchestrator:
    build:
      context: ./rover_a1_orchestrator
    restart: always
    # Its sshd listens on 24 (one SSH port per container in the shared host network: platform 22,
    # sensors 23, orchestrator 24, drive-interface 25, cockpit 26).
    network_mode: host
    # map_autosaver writes /maps/map.{yaml,pgm} while localization_source=slam, and
    # localization_source=amcl reads it back through ROVER_NAV_MAP. A named volume, not a bind
    # mount: a balenaOS device filesystem is read-only outside /data. The map survives container
    # restarts and image updates, but not a device reprovision - copy it off with
    # `scp -P 24 root@<device>:/maps/map.* .`
    volumes:
      - rover-maps:/maps
    environment:
      ROVER_NAMESPACE: 'rover'
      ROVER_START_ROS_PLATFORM: 'true'
      ROVER_START_NAVIGATION: 'false'
      ROVER_START_MISSION_MANAGER: 'false'
      ROVER_START_SENSORS: 'false'
      ROVER_USE_GPS: 'false'
      ROVER_GPS_PUBLISH_MAP_TF: 'false'
      ROVER_USE_LIDAR: 'false'
      ROVER_LOCALIZATION_SOURCE:
      ROVER_NAV_MAP:
      ROVER_AMCL_INITIAL_POSE_X:
      ROVER_AMCL_INITIAL_POSE_Y:
      ROVER_AMCL_INITIAL_POSE_YAW:
      ROVER_GPS_LOCALIZATION_X:
      ROVER_GPS_LOCALIZATION_Y:
      ROVER_GPS_LOCALIZATION_Z:
      ROVER_GPS_ORIENTATION_R:
      ROVER_GPS_ORIENTATION_P:
      ROVER_GPS_ORIENTATION_Y:
      ROVER_IMU_LOCALIZATION_X:
      ROVER_IMU_LOCALIZATION_Y:
      ROVER_IMU_LOCALIZATION_Z:
      ROVER_IMU_ORIENTATION_R:
      ROVER_IMU_ORIENTATION_P:
      ROVER_IMU_ORIENTATION_Y:
      ROVER_LIDAR_LOCALIZATION_X:
      ROVER_LIDAR_LOCALIZATION_Y:
      ROVER_LIDAR_LOCALIZATION_Z:
      ROVER_LIDAR_ORIENTATION_R:
      ROVER_LIDAR_ORIENTATION_P:
      ROVER_LIDAR_ORIENTATION_Y:
      ROVER_COCKPIT_PORT: '80'
      ROVER_COCKPIT_USER: 'rover'
      ROVER_COCKPIT_PASSWORD:
      ROVER_COCKPIT_DEBUG: 'false'
      ROVER_COCKPIT_ORIGINS:
      ROVER_DRIVE_ENABLE: 'true'
      ROVER_DRIVE_PORT: '5000'
      ROVER_DRIVE_USER: 'rover'
      ROVER_DRIVE_PASSWORD:
      ROVER_DRIVE_MAX_LINEAR: '1.0'
      ROVER_DRIVE_MAX_ANGULAR: '1.0'
      ROVER_DRIVE_MAX_RIM_SPEED: '1.7'
      ROVER_DRIVE_TRACK_WIDTH: '1.0204'
      ROVER_DRIVE_EXPO_LINEAR: '0.3'
      ROVER_DRIVE_EXPO_ANGULAR: '0.5'
  rover-a1-sensors:
    build:
      context: ./rover_a1_sensors
    restart: always
    # Its sshd listens on 23: platform 22, sensors 23, orchestrator 24, drive-interface 25, cockpit 26.
    network_mode: host
    environment:
      ROVER_NAMESPACE: 'rover'
      ROVER_START_ROS_PLATFORM: 'true'
      ROVER_START_NAVIGATION: 'false'
      ROVER_START_MISSION_MANAGER: 'false'
      ROVER_START_SENSORS: 'false'
      ROVER_USE_GPS: 'false'
      ROVER_GPS_PUBLISH_MAP_TF: 'false'
      ROVER_USE_LIDAR: 'false'
      ROVER_LOCALIZATION_SOURCE:
      ROVER_NAV_MAP:
      ROVER_AMCL_INITIAL_POSE_X:
      ROVER_AMCL_INITIAL_POSE_Y:
      ROVER_AMCL_INITIAL_POSE_YAW:
      ROVER_GPS_LOCALIZATION_X:
      ROVER_GPS_LOCALIZATION_Y:
      ROVER_GPS_LOCALIZATION_Z:
      ROVER_GPS_ORIENTATION_R:
      ROVER_GPS_ORIENTATION_P:
      ROVER_GPS_ORIENTATION_Y:
      ROVER_IMU_LOCALIZATION_X:
      ROVER_IMU_LOCALIZATION_Y:
      ROVER_IMU_LOCALIZATION_Z:
      ROVER_IMU_ORIENTATION_R:
      ROVER_IMU_ORIENTATION_P:
      ROVER_IMU_ORIENTATION_Y:
      ROVER_LIDAR_LOCALIZATION_X:
      ROVER_LIDAR_LOCALIZATION_Y:
      ROVER_LIDAR_LOCALIZATION_Z:
      ROVER_LIDAR_ORIENTATION_R:
      ROVER_LIDAR_ORIENTATION_P:
      ROVER_LIDAR_ORIENTATION_Y:
      ROVER_COCKPIT_PORT: '80'
      ROVER_COCKPIT_USER: 'rover'
      ROVER_COCKPIT_PASSWORD:
      ROVER_COCKPIT_DEBUG: 'false'
      ROVER_COCKPIT_ORIGINS:
      ROVER_DRIVE_ENABLE: 'true'
      ROVER_DRIVE_PORT: '5000'
      ROVER_DRIVE_USER: 'rover'
      ROVER_DRIVE_PASSWORD:
      ROVER_DRIVE_MAX_LINEAR: '1.0'
      ROVER_DRIVE_MAX_ANGULAR: '1.0'
      ROVER_DRIVE_MAX_RIM_SPEED: '1.7'
      ROVER_DRIVE_TRACK_WIDTH: '1.0204'
      ROVER_DRIVE_EXPO_LINEAR: '0.3'
      ROVER_DRIVE_EXPO_ANGULAR: '0.5'
  rover-cockpit:
    build:
      context: ./rover_cockpit
    restart: always
    network_mode: host
    # The Networking tab runs `ping`.
    cap_add:
      - NET_RAW
    environment:
      ROVER_NAMESPACE: 'rover'
      ROVER_START_ROS_PLATFORM: 'true'
      ROVER_START_NAVIGATION: 'false'
      ROVER_START_MISSION_MANAGER: 'false'
      ROVER_START_SENSORS: 'false'
      ROVER_USE_GPS: 'false'
      ROVER_GPS_PUBLISH_MAP_TF: 'false'
      ROVER_USE_LIDAR: 'false'
      ROVER_LOCALIZATION_SOURCE:
      ROVER_NAV_MAP:
      ROVER_AMCL_INITIAL_POSE_X:
      ROVER_AMCL_INITIAL_POSE_Y:
      ROVER_AMCL_INITIAL_POSE_YAW:
      ROVER_GPS_LOCALIZATION_X:
      ROVER_GPS_LOCALIZATION_Y:
      ROVER_GPS_LOCALIZATION_Z:
      ROVER_GPS_ORIENTATION_R:
      ROVER_GPS_ORIENTATION_P:
      ROVER_GPS_ORIENTATION_Y:
      ROVER_IMU_LOCALIZATION_X:
      ROVER_IMU_LOCALIZATION_Y:
      ROVER_IMU_LOCALIZATION_Z:
      ROVER_IMU_ORIENTATION_R:
      ROVER_IMU_ORIENTATION_P:
      ROVER_IMU_ORIENTATION_Y:
      ROVER_LIDAR_LOCALIZATION_X:
      ROVER_LIDAR_LOCALIZATION_Y:
      ROVER_LIDAR_LOCALIZATION_Z:
      ROVER_LIDAR_ORIENTATION_R:
      ROVER_LIDAR_ORIENTATION_P:
      ROVER_LIDAR_ORIENTATION_Y:
      ROVER_COCKPIT_PORT: '80'
      ROVER_COCKPIT_USER: 'rover'
      ROVER_COCKPIT_PASSWORD:
      ROVER_COCKPIT_DEBUG: 'false'
      ROVER_COCKPIT_ORIGINS:
      ROVER_DRIVE_ENABLE: 'true'
      ROVER_DRIVE_PORT: '5000'
      ROVER_DRIVE_USER: 'rover'
      ROVER_DRIVE_PASSWORD:
      ROVER_DRIVE_MAX_LINEAR: '1.0'
      ROVER_DRIVE_MAX_ANGULAR: '1.0'
      ROVER_DRIVE_MAX_RIM_SPEED: '1.7'
      ROVER_DRIVE_TRACK_WIDTH: '1.0204'
      ROVER_DRIVE_EXPO_LINEAR: '0.3'
      ROVER_DRIVE_EXPO_ANGULAR: '0.5'
    healthcheck:
      # A script in the image reads ROVER_COCKPIT_PORT at run time. No `$` here: balena's
      # compose parser mangles `$$`, which made this check fail forever and restart cockpit.
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  rover-a1-drive-interface:
    build:
      context: ./rover_a1_drive_interface
    restart: always
    network_mode: host
    environment:
      ROVER_NAMESPACE: 'rover'
      ROVER_START_ROS_PLATFORM: 'true'
      ROVER_START_NAVIGATION: 'false'
      ROVER_START_MISSION_MANAGER: 'false'
      ROVER_START_SENSORS: 'false'
      ROVER_USE_GPS: 'false'
      ROVER_GPS_PUBLISH_MAP_TF: 'false'
      ROVER_USE_LIDAR: 'false'
      ROVER_LOCALIZATION_SOURCE:
      ROVER_NAV_MAP:
      ROVER_AMCL_INITIAL_POSE_X:
      ROVER_AMCL_INITIAL_POSE_Y:
      ROVER_AMCL_INITIAL_POSE_YAW:
      ROVER_GPS_LOCALIZATION_X:
      ROVER_GPS_LOCALIZATION_Y:
      ROVER_GPS_LOCALIZATION_Z:
      ROVER_GPS_ORIENTATION_R:
      ROVER_GPS_ORIENTATION_P:
      ROVER_GPS_ORIENTATION_Y:
      ROVER_IMU_LOCALIZATION_X:
      ROVER_IMU_LOCALIZATION_Y:
      ROVER_IMU_LOCALIZATION_Z:
      ROVER_IMU_ORIENTATION_R:
      ROVER_IMU_ORIENTATION_P:
      ROVER_IMU_ORIENTATION_Y:
      ROVER_LIDAR_LOCALIZATION_X:
      ROVER_LIDAR_LOCALIZATION_Y:
      ROVER_LIDAR_LOCALIZATION_Z:
      ROVER_LIDAR_ORIENTATION_R:
      ROVER_LIDAR_ORIENTATION_P:
      ROVER_LIDAR_ORIENTATION_Y:
      ROVER_COCKPIT_PORT: '80'
      ROVER_COCKPIT_USER: 'rover'
      ROVER_COCKPIT_PASSWORD:
      ROVER_COCKPIT_DEBUG: 'false'
      ROVER_COCKPIT_ORIGINS:
      ROVER_DRIVE_ENABLE: 'true'
      ROVER_DRIVE_PORT: '5000'
      ROVER_DRIVE_USER: 'rover'
      ROVER_DRIVE_PASSWORD:
      ROVER_DRIVE_MAX_LINEAR: '1.0'
      ROVER_DRIVE_MAX_ANGULAR: '1.0'
      ROVER_DRIVE_MAX_RIM_SPEED: '1.7'
      ROVER_DRIVE_TRACK_WIDTH: '1.0204'
      ROVER_DRIVE_EXPO_LINEAR: '0.3'
      ROVER_DRIVE_EXPO_ANGULAR: '0.5'
    healthcheck:
      # Script in the image (reads ROVER_DRIVE_PORT); no `$` here, see rover-cockpit.
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  # Persists the SLAM map across container restarts for localization_source=amcl.
  rover-maps:
  # Persists the measured RC stick calibration. Only rover-a1-platform needs it: the Cockpit page
  # reaches the calibration through the node's rc/calibration services, never by reading the file.
  rover-config:
