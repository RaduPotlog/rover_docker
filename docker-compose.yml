version: '2.4'

services:
  rovera1-app:
    build:
      context: ./rovera1_app
    privileged: true
    restart: always
    network_mode: host
    labels:
      io.balena.features.dbus: 'true'
      io.balena.features.balena-socket: 'true'
      io.balena.features.sysfs: 'true'
  rover-web-server:
    build:
      context: ./rover_web_server
    restart: always
    # The monitored addresses (192.168.1.0/24, 192.168.77.0/24,
    # 192.168.88.0/24, 172.22.100.97) are rover-local segments that bridged
    # networking would not reach. Host mode also means no port mapping is
    # needed - port 80 binds straight to the device's interfaces.
    network_mode: host
    # ICMP needs CAP_NET_RAW. Docker grants it by default; declaring it keeps
    # the service working under a hardened profile without needing the
    # `privileged: true` that rovera1-app requires.
    cap_add:
      - NET_RAW
    environment:
      # Port 80 so the balenaCloud Public Device URL reaches the dashboard.
      ROVER_WEB_PORT: '80'
      ROVER_WEB_POLL_INTERVAL_SECONDS: '5'
      ROVER_WEB_PING_TIMEOUT_SECONDS: '1'
    # curl is absent from python:3.12-slim, hence the python one-liner.
    # start_period covers the FastAPI lifespan handler, which completes a full
    # ping sweep before the app accepts traffic.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/healthz')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
