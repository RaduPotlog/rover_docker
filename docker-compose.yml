      ROVER_ORCH_MISSION_MANAGER: 'false'
      ROVER_ORCH_DRIVE_MODE: 'true'
      ROVER_ORCH_DRIVE_DEFAULT_MODE: 'assisted'
      ROVER_ORCH_LOCALIZATION_SOURCE:
      ROVER_ORCH_NAV_MAP:
      ROVER_ORCH_NAV_USE_CAMERA: 'false'
      ROVER_ORCH_AMCL_INITIAL_POSE_X:
      ROVER_ORCH_AMCL_INITIAL_POSE_Y:
      ROVER_ORCH_AMCL_INITIAL_POSE_YAW:
      ROVER_SENSORS_ENABLE: 'false'
      ROVER_UI_ENABLE: 'true'
      ROVER_UI_PORT: '5000'
      ROVER_UI_USER: 'rover'
      ROVER_UI_PASSWORD:
      ROVER_UI_MAX_LINEAR: '1.0'
      ROVER_UI_MAX_ANGULAR: '1.0'
      ROVER_UI_MAX_RIM_SPEED: '1.7'
      ROVER_UI_TRACK_WIDTH: '1.0204'
      ROVER_UI_EXPO_LINEAR: '0.3'
      ROVER_UI_EXPO_ANGULAR: '0.5'
      ROVER_VDA5050_ENABLE: 'false'
      ROVER_VDA5050_LOCAL_BROKER: 'true'
      ROVER_VDA5050_BROKER_HOST: '127.0.0.1'
      ROVER_VDA5050_BROKER_PORT: '1883'
      ROVER_VDA5050_BROKER_USER:
      ROVER_VDA5050_BROKER_PASSWORD:
      ROVER_VDA5050_BROKER_TLS: 'auto'
      ROVER_VDA5050_MANUFACTURER: 'MechatronicsAcademy'
      ROVER_VDA5050_SERIAL_NUMBER: 'rover_a1'
      ROVER_VDA5050_MAP_FRAME:
  rover-a1-sensors:
    build:
      context: ./rover_a1_sensors
    depends_on:
      - rover-a1-zenoh-router
    restart: always
    network_mode: host
