  # Runs its own Mosquitto (1883, WebSockets 9001) with ROVER_VDA5050_LOCAL_BROKER=true; sshd on 26.
  rover-a1-vda5050:
    build:
      context: ./rover_a1_vda5050
    # Start order only; start.sh still waits until the router accepts connections.
    depends_on:
      - rover-a1-zenoh-router
    restart: always
    network_mode: host
    environment:
      ROVER_SYSTEM_NAMESPACE: 'rover'
      ROVER_SYSTEM_USE_GPS: 'false'
      ROVER_SYSTEM_USE_LIDAR: 'false'
      ROVER_SYSTEM_FOLLOW_ME_ENABLE: 'false'
      ROVER_SYSTEM_MOUNT_IMU_X:
      ROVER_SYSTEM_MOUNT_IMU_Y:
      ROVER_SYSTEM_MOUNT_IMU_Z:
      ROVER_SYSTEM_MOUNT_IMU_ROLL:
      ROVER_SYSTEM_MOUNT_IMU_PITCH:
      ROVER_SYSTEM_MOUNT_IMU_YAW:
      ROVER_SYSTEM_MOUNT_GPS_X:
      ROVER_SYSTEM_MOUNT_GPS_Y:
      ROVER_SYSTEM_MOUNT_GPS_Z:
      ROVER_SYSTEM_MOUNT_GPS_ROLL:
      ROVER_SYSTEM_MOUNT_GPS_PITCH:
      ROVER_SYSTEM_MOUNT_GPS_YAW:
      ROVER_SYSTEM_MOUNT_LIDAR_X:
      ROVER_SYSTEM_MOUNT_LIDAR_Y:
      ROVER_SYSTEM_MOUNT_LIDAR_Z:
      ROVER_SYSTEM_MOUNT_LIDAR_ROLL:
      ROVER_SYSTEM_MOUNT_LIDAR_PITCH:
      ROVER_SYSTEM_MOUNT_LIDAR_YAW:
      ROVER_SYSTEM_MOUNT_CAMERA_X:
      ROVER_SYSTEM_MOUNT_CAMERA_Y:
      ROVER_SYSTEM_MOUNT_CAMERA_Z:
      ROVER_SYSTEM_MOUNT_CAMERA_ROLL:
      ROVER_SYSTEM_MOUNT_CAMERA_PITCH:
      ROVER_SYSTEM_MOUNT_CAMERA_YAW:
      ROVER_ZENOH_MODE_PLATFORM: 'peer'
      ROVER_ZENOH_MODE_ORCH: 'client'
      ROVER_ZENOH_MODE_SENSORS: 'client'
      ROVER_ZENOH_MODE_VDA5050: 'client'
