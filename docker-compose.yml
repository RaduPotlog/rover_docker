version: '2.4'

# Every ROVER service except rover-a1-zenoh-router declares the same ROVER_* variables, in the
# same order (the sensors and orchestrator add the camera ones they read); each service acts only
# on some of them (README.md, "Device variables"). A balenaCloud fleet/device variable overrides them.
# `KEY: 'value'` is a default; `KEY:` stays unset unless balenaCloud sets it.
#
# Names are ROVER_<SCOPE>_<THING>: SCOPE is the container that runs it (PLATFORM, ORCH,
# SENSORS, UI, VDA5050, NETWORK) or SYSTEM, read by several containers - set a ROVER_SYSTEM_*
# variable for all services so they agree. Renamed 2026-10-10: tools/env_renames.yaml maps the
# old names, `tools/balena_env.py migrate` renames them on balenaCloud.
#
# --- SYSTEM ---
# ROVER_SYSTEM_NAMESPACE        ROS namespace and TF prefix
# ROVER_SYSTEM_USE_GPS          sensors: GNSS driver; platform: GPS fusion;
#                               orchestrator: Nav 2 localization_source gps vs odom
# ROVER_SYSTEM_USE_LIDAR        sensors: RS16 driver; orchestrator: warns when off
# ROVER_SYSTEM_USE_CAMERA       sensors: RealSense driver (rover_realsense) + camera perception
#                               nodes (default false); orchestrator: only warns when
#                               ROVER_ORCH_NAV_USE_CAMERA or ROVER_SYSTEM_FOLLOW_ME_ENABLE needs it
# ROVER_SYSTEM_FOLLOW_ME_ENABLE follow-me (default false). sensors: fmoc person tracking
#                               (rover_perception, needs ROVER_SYSTEM_USE_CAMERA); orchestrator: the
#                               follow_me node (rover_follow_me). A person standing 1.5 m in front
#                               of the stopped rover is picked up; `ros2 service call
#                               /<ns>/follow_me/start std_srvs/srv/Trigger` (or the drive UI, or the
#                               VDA 5050 instant action startFollowing) starts following through
#                               Nav 2's Following server. Needs ROVER_ORCH_NAVIGATION,
#                               ROVER_ORCH_MISSION_MANAGER and AUTOMATIC drive mode
# ROVER_SYSTEM_MOUNT_<IMU|GPS|LIDAR|CAMERA>_<X|Y|Z|ROLL|PITCH|YAW>
#                               sensor mount pose relative to body_link (m, rad), read by
#                               rover_description in the platform; unset = URDF default
#
# --- Zenoh session mode, one per container ---
# ROVER_ZENOH_MODE_<PLATFORM|ORCH|SENSORS|VDA5050>
#                               how that container's ROS processes join Zenoh.
#                               peer = direct links between processes (platform default, so its
#                               control loops never wait on the router); client = one link to
#                               rover-a1-zenoh-router (the others' default). See README.md
#                               "ROS 2 over the rover LAN" before changing one
#
# --- rover-a1-platform ---
# ROVER_PLATFORM_ENABLE         run rover_bringup (the only stack switch on by default); the
#                               orchestrator reads it too, so set it for all services
# ROVER_PLATFORM_GPS_MAP_TF     global EKF publishes map -> odom (default false: SLAM/AMCL own it);
#                               orchestrator: localization_source checks
# ROVER_PLATFORM_FOXGLOVE_TOPIC_WHITELIST
#                               foxglove_bridge topic_whitelist; unset = only the topics the web
#                               UIs use (rover_web_bridges.launch.py), "['.*']" = everything
# ROVER_PLATFORM_FOXGLOVE_SERVICE_WHITELIST
#                               foxglove_bridge service_whitelist; unset = only the services the
#                               web UIs call, "['.*']" = everything
#
# --- rover-a1-orchestrator ---
# ROVER_ORCH_NAVIGATION         run Nav 2 (also needs ROVER_PLATFORM_ENABLE)
# ROVER_ORCH_MISSION_MANAGER    run the mission manager on top of Nav 2 (needed for the AUTOMATIC
#                               driving mode / GoTo)
# ROVER_ORCH_DRIVE_MODE         run rover_drive_mode (default true, independent of Nav 2): routes
#                               the drive UI's joystick; off = the drive UI cannot drive
# ROVER_ORCH_DRIVE_DEFAULT_MODE driving mode at boot, assisted (lidar slow/stop) | manual
# ROVER_ORCH_LOCALIZATION_SOURCE
#                               odom | gps | slam | amcl | indoor, overrides ROVER_SYSTEM_USE_GPS;
#                               indoor = drive-UI mapping + maps in /maps (rover_indoor_nav_manager);
#                               sensors: indoor/slam/amcl make poor GNSS accuracy a WARN, not an ERROR
# ROVER_ORCH_NAV_MAP            map yaml, default rover_navigation's empty_world; REQUIRED for
#                               localization_source=amcl (the default empty map cannot localize) -
#                               build one with =slam first
# ROVER_ORCH_NAV_USE_CAMERA     add the camera depth cloud to the Nav 2 local costmap (default
#                               false; needs ROVER_SYSTEM_USE_CAMERA, and a measured camera mount)
# ROVER_ORCH_AMCL_INITIAL_POSE_<X|Y|YAW>
#                               pose AMCL is seeded with at startup, in the map frame; unset =
#                               0,0,0, correct only if the map origin is the dock
#
# --- rover-a1-sensors ---
# ROVER_SENSORS_ENABLE          run the sensor payload drivers at all
# ROVER_SENSORS_CAMERA_*        RealSense stream rate/resolution, depth cloud, AprilTags, YOLO
#                               detection (with ROVER_SYSTEM_USE_CAMERA)
# ROVER_SENSORS_TERRAIN         ground slope from the lidar cloud (needs ROVER_SYSTEM_USE_LIDAR)
#
# --- rover-a1-drive-interface ---
# ROVER_UI_*                    on/off, http port, login, teleop speed limits (m/s, rad/s),
#                               rim-speed limit + track width (keep equal to rover_crsf_teleop.yaml),
#                               stick expo per axis (0 linear .. 1 softest);
#                               no password = nginx is not started (the container idles, sshd on 25 only)
#
# --- rover-a1-vda5050 ---
# ROVER_VDA5050_ENABLE          run the VDA 5050 fleet interface (default false; orders need
#                               ROVER_ORCH_MISSION_MANAGER=true on the orchestrator)
# ROVER_VDA5050_*               local Mosquitto on/off, broker host/port/user/password, TLS
#                               (auto = on when a user is set, false = plaintext e.g. over WireGuard),
#                               manufacturer + serial number (MQTT topic levels),
#                               Nav 2 frame of the order coordinates (unset = odom or map, following
#                               the orchestrator's localization source)
#
# All services use host networking: they share the Zenoh router on 127.0.0.1:7447 (its own
# service, rover-a1-zenoh-router, so it keeps running while the others restart), and the sensors
# receive UDP (NMEA 10110, RS16 6699/7788) directly.

services:
  # The Zenoh router (rmw_zenohd) all ROS processes connect to. Its own service, so platform
  # restarts and releases don't take the ROS graph down with it: the image only changes with
  # the ROS release. Binds 127.0.0.1:7447 plus ROVER_SYSTEM_LAN_IP (default 192.168.1.201) for
  # PCs on the rover LAN (setup_rover_pc.sh). It reads only ROVER_SYSTEM_LAN_IP, which balena
  # injects from the balenaCloud variable, so it declares no environment of its own.
  rover-a1-zenoh-router:
    build:
      context: ./rover_a1_zenoh_router
    restart: always
    # rmw_zenohd starts closing on SIGTERM but, with clients connected, never finishes (seen
    # 2026-09-26: "close session" logged, then SIGKILL 10 s later). It holds no state, so kill it
    # after 2 s: a restart then interrupts cross-container traffic for ~3 s instead of ~11 s.
    stop_grace_period: 2s
    network_mode: host
    healthcheck:
      # Script in the image (TCP connect to 127.0.0.1:7447); no `$` here (balena's compose parser mangles `$$`).
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  rover-a1-platform:
    build:
      context: ./rover_a1_platform
    # Start order only; start.sh still waits until the router accepts connections.
    depends_on:
      - rover-a1-zenoh-router
    # Direct hardware access for the rover drivers.
    privileged: true
    restart: always
    network_mode: host
    labels:
      io.balena.features.dbus: 'true'
      # rover_safety powers off the device through the Supervisor API (/v1/shutdown).
      io.balena.features.supervisor-api: '1'
      io.balena.features.balena-socket: 'true'
      io.balena.features.sysfs: 'true'
    # rover_crsf_teleop writes the measured RC stick calibration to
    # /config/rover_crsf_teleop/rc_calibration.yaml when an operator applies one through the
    # node's rc/calibration services. A named volume, not a bind mount, for the same reason as rover-maps: a balenaOS
    # device filesystem is read-only outside one. It survives container restarts and image
    # updates, but not a device reprovision - copy it off with
    # `scp root@<device>:/config/rover_crsf_teleop/rc_calibration.yaml .` (sshd is on port 22).
    volumes:
      - rover-config:/config
    environment:
      ROVER_SYSTEM_NAMESPACE: 'rover'
      ROVER_SYSTEM_USE_GPS: 'false'
      ROVER_SYSTEM_USE_LIDAR: 'false'
      ROVER_SYSTEM_FOLLOW_ME_ENABLE: 'false'
      ROVER_SYSTEM_MOUNT_IMU_X:
      ROVER_SYSTEM_MOUNT_IMU_Y:
      ROVER_SYSTEM_MOUNT_IMU_Z:
      ROVER_SYSTEM_MOUNT_IMU_ROLL:
      ROVER_SYSTEM_MOUNT_IMU_PITCH:
      ROVER_SYSTEM_MOUNT_IMU_YAW:
      ROVER_SYSTEM_MOUNT_GPS_X:
      ROVER_SYSTEM_MOUNT_GPS_Y:
      ROVER_SYSTEM_MOUNT_GPS_Z:
      ROVER_SYSTEM_MOUNT_GPS_ROLL:
      ROVER_SYSTEM_MOUNT_GPS_PITCH:
      ROVER_SYSTEM_MOUNT_GPS_YAW:
      ROVER_SYSTEM_MOUNT_LIDAR_X:
      ROVER_SYSTEM_MOUNT_LIDAR_Y:
      ROVER_SYSTEM_MOUNT_LIDAR_Z:
      ROVER_SYSTEM_MOUNT_LIDAR_ROLL:
      ROVER_SYSTEM_MOUNT_LIDAR_PITCH:
      ROVER_SYSTEM_MOUNT_LIDAR_YAW:
      ROVER_SYSTEM_MOUNT_CAMERA_X:
      ROVER_SYSTEM_MOUNT_CAMERA_Y:
      ROVER_SYSTEM_MOUNT_CAMERA_Z:
      ROVER_SYSTEM_MOUNT_CAMERA_ROLL:
      ROVER_SYSTEM_MOUNT_CAMERA_PITCH:
      ROVER_SYSTEM_MOUNT_CAMERA_YAW:
      ROVER_ZENOH_MODE_PLATFORM: 'peer'
      ROVER_ZENOH_MODE_ORCH: 'client'
      ROVER_ZENOH_MODE_SENSORS: 'client'
      ROVER_ZENOH_MODE_VDA5050: 'client'
      ROVER_PLATFORM_ENABLE: 'true'
      ROVER_PLATFORM_GPS_MAP_TF: 'false'
      ROVER_PLATFORM_FOXGLOVE_TOPIC_WHITELIST:
      ROVER_PLATFORM_FOXGLOVE_SERVICE_WHITELIST:
      ROVER_ORCH_NAVIGATION: 'false'
      ROVER_ORCH_MISSION_MANAGER: 'false'
      ROVER_ORCH_DRIVE_MODE: 'true'
      ROVER_ORCH_DRIVE_DEFAULT_MODE: 'assisted'
      ROVER_ORCH_LOCALIZATION_SOURCE:
      ROVER_ORCH_NAV_MAP:
      ROVER_ORCH_NAV_USE_CAMERA: 'false'
      ROVER_ORCH_AMCL_INITIAL_POSE_X:
      ROVER_ORCH_AMCL_INITIAL_POSE_Y:
      ROVER_ORCH_AMCL_INITIAL_POSE_YAW:
      ROVER_SENSORS_ENABLE: 'false'
      ROVER_UI_ENABLE: 'true'
      ROVER_UI_PORT: '5000'
      ROVER_UI_USER: 'rover'
      ROVER_UI_PASSWORD:
      ROVER_UI_MAX_LINEAR: '1.0'
      ROVER_UI_MAX_ANGULAR: '1.0'
      ROVER_UI_MAX_RIM_SPEED: '1.7'
      ROVER_UI_TRACK_WIDTH: '1.0204'
      ROVER_UI_EXPO_LINEAR: '0.3'
      ROVER_UI_EXPO_ANGULAR: '0.5'
      ROVER_VDA5050_ENABLE: 'false'
      ROVER_VDA5050_LOCAL_BROKER: 'true'
      ROVER_VDA5050_BROKER_HOST: '127.0.0.1'
      ROVER_VDA5050_BROKER_PORT: '1883'
      ROVER_VDA5050_BROKER_USER:
      ROVER_VDA5050_BROKER_PASSWORD:
      ROVER_VDA5050_BROKER_TLS: 'auto'
      ROVER_VDA5050_MANUFACTURER: 'MechatronicsAcademy'
      ROVER_VDA5050_SERIAL_NUMBER: 'rover_a1'
      ROVER_VDA5050_MAP_FRAME:
  rover-a1-orchestrator:
    build:
      context: ./rover_a1_orchestrator
    # Start order only; start.sh still waits until the router accepts connections.
    depends_on:
      - rover-a1-zenoh-router
    restart: always
    # Its sshd listens on 24 (one SSH port per container in the shared host network: platform 22,
    # sensors 23, orchestrator 24, drive-interface 25, vda5050 26).
    network_mode: host
    # map_autosaver writes /maps/map.{yaml,pgm} while localization_source=slam, and
    # localization_source=amcl reads it back through ROVER_ORCH_NAV_MAP. A named volume, not a bind
    # mount: a balenaOS device filesystem is read-only outside /data. The map survives container
    # restarts and image updates, but not a device reprovision - copy it off with
    # `scp -P 24 root@<device>:/maps/map.* .`
    volumes:
      - rover-maps:/maps
    environment:
      ROVER_SYSTEM_NAMESPACE: 'rover'
      ROVER_SYSTEM_USE_GPS: 'false'
      ROVER_SYSTEM_USE_LIDAR: 'false'
      ROVER_SYSTEM_USE_CAMERA: 'false'
      ROVER_SYSTEM_FOLLOW_ME_ENABLE: 'false'
      ROVER_SYSTEM_MOUNT_IMU_X:
      ROVER_SYSTEM_MOUNT_IMU_Y:
      ROVER_SYSTEM_MOUNT_IMU_Z:
      ROVER_SYSTEM_MOUNT_IMU_ROLL:
      ROVER_SYSTEM_MOUNT_IMU_PITCH:
      ROVER_SYSTEM_MOUNT_IMU_YAW:
      ROVER_SYSTEM_MOUNT_GPS_X:
      ROVER_SYSTEM_MOUNT_GPS_Y:
      ROVER_SYSTEM_MOUNT_GPS_Z:
      ROVER_SYSTEM_MOUNT_GPS_ROLL:
      ROVER_SYSTEM_MOUNT_GPS_PITCH:
      ROVER_SYSTEM_MOUNT_GPS_YAW:
      ROVER_SYSTEM_MOUNT_LIDAR_X:
      ROVER_SYSTEM_MOUNT_LIDAR_Y:
      ROVER_SYSTEM_MOUNT_LIDAR_Z:
      ROVER_SYSTEM_MOUNT_LIDAR_ROLL:
      ROVER_SYSTEM_MOUNT_LIDAR_PITCH:
      ROVER_SYSTEM_MOUNT_LIDAR_YAW:
      ROVER_SYSTEM_MOUNT_CAMERA_X:
      ROVER_SYSTEM_MOUNT_CAMERA_Y:
      ROVER_SYSTEM_MOUNT_CAMERA_Z:
      ROVER_SYSTEM_MOUNT_CAMERA_ROLL:
      ROVER_SYSTEM_MOUNT_CAMERA_PITCH:
      ROVER_SYSTEM_MOUNT_CAMERA_YAW:
      ROVER_ZENOH_MODE_PLATFORM: 'peer'
      ROVER_ZENOH_MODE_ORCH: 'client'
      ROVER_ZENOH_MODE_SENSORS: 'client'
      ROVER_ZENOH_MODE_VDA5050: 'client'
      ROVER_PLATFORM_ENABLE: 'true'
      ROVER_PLATFORM_GPS_MAP_TF: 'false'
      ROVER_PLATFORM_FOXGLOVE_TOPIC_WHITELIST:
      ROVER_PLATFORM_FOXGLOVE_SERVICE_WHITELIST:
      ROVER_ORCH_NAVIGATION: 'false'
      ROVER_ORCH_MISSION_MANAGER: 'false'
      ROVER_ORCH_DRIVE_MODE: 'true'
