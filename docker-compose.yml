  # VDA 5050 fleet interface: InOrbit's connector + rover_vda5050_adapter (rover_vda5050), driving
  # through rover_mission_manager in rover-a1-orchestrator. Idle unless ROVER_VDA5050_ENABLE=true.
  # Runs its own Mosquitto (1883, WebSockets 9001) with ROVER_VDA5050_LOCAL_BROKER=true; sshd on 26.
  rover-a1-vda5050:
    build:
      context: ./rover_a1_vda5050
    # Start order only; start.sh still waits until the router accepts connections.
    depends_on:
