fleet: g_potlog_radu/rovera1
device: null

variables:
  # --- Sensors ---
  - {name: ROVER_SENSORS_ENABLE, value: 'true', default: 'false', level: device, service: 'rover-a1-sensors'}
  - {name: ROVER_SENSORS_CAMERA_FPS, value: null, default: '15', level: device, service: '*'}
  - {name: ROVER_SENSORS_CAMERA_DEPTH_PROFILE, value: null, default: 424x240, level: device, service: '*'}
  - {name: ROVER_SENSORS_CAMERA_DEPTH_CLOUD, value: null, default: 'true', level: device, service: '*'}
  - {name: ROVER_SENSORS_CAMERA_FIDUCIALS, value: null, default: 'false', level: device, service: '*'}
  - {name: ROVER_SENSORS_CAMERA_FIDUCIALS_DECIMATE, value: null, default: '2.0', level: device, service: '*'}
  - {name: ROVER_SENSORS_CAMERA_DETECTION, value: null, default: 'false', level: device, service: '*'}
  - {name: ROVER_SENSORS_CAMERA_DETECTION_MODEL, value: null, default: null, level: device, service: '*'}
  - {name: ROVER_SENSORS_CAMERA_DETECTION_GPU, value: null, default: 'false', level: device, service: '*'}
  - {name: ROVER_SENSORS_CAMERA_DETECTION_MAX_RATE, value: null, default: '10.0', level: device, service: '*'}
  - {name: ROVER_SENSORS_TERRAIN, value: null, default: 'false', level: device, service: '*'}
  # --- Zenoh session mode ---
  - {name: ROVER_ZENOH_MODE_SENSORS, value: client, default: client, level: device, service: 'rover-a1-sensors'}
  
