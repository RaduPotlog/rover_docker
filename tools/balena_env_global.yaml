  - {name: ROVER_SYSTEM_MOUNT_LIDAR_PITCH, value: null, default: null, level: device, service: '*'}
  - {name: ROVER_SYSTEM_MOUNT_LIDAR_YAW, value: null, default: null, level: device, service: '*'}
  - {name: ROVER_SYSTEM_MOUNT_CAMERA_X, value: null, default: null, level: device, service: '*'}
  - {name: ROVER_SYSTEM_MOUNT_CAMERA_Y, value: null, default: null, level: device, service: '*'}
