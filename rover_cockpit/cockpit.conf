[WebService]
# The page must be served over http: the plugin opens ws://<host>:8765 to
# foxglove_bridge, which a browser blocks as mixed content on an https page.
AllowUnencrypted=true
LoginTitle=Rover A1 diagnostics

# No systemd in the container, so nothing socket-activates cockpit-session on
# /run/cockpit/session (cockpit-ws's default). Have cockpit-ws, running as root,
# spawn it directly for password logins instead.
[basic]
Command=/usr/lib/cockpit/cockpit-session
