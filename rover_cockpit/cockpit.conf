[WebService]
# Plain http, no TLS for now. The plugin reaches foxglove_bridge through the
# Cockpit session (a TCP stream channel to 127.0.0.1:8765), not a browser WebSocket.
AllowUnencrypted=true
LoginTitle=Rover A1 diagnostics
# balenaCloud's Public Device URL proxy terminates TLS and forwards plain http, so the
# browser's WebSocket Origin is https://<uuid>.balena-devices.com while cockpit-ws
# (--no-tls) expects http://... and rejects /cockpit/socket ("Connection failed" after
# login). Take the scheme from the proxy's X-Forwarded-Proto instead. The origin is
# still checked against the Host header, so LAN access over http://<lan-ip>/ is unchanged.
ProtocolHeader=X-Forwarded-Proto

[Session]
# Cockpit logs a session out after 15 minutes without mouse or keyboard input.
# The plugin is a dashboard that is mostly watched, not clicked, so that logged
# users out over and over. 0 disables the idle logout.
IdleTimeout=0

# No systemd in the container, so nothing socket-activates cockpit-session on
# /run/cockpit/session (cockpit-ws's default). Have cockpit-ws, running as root,
# spawn it directly for password logins instead.
[basic]
Command=/usr/lib/cockpit/cockpit-session
